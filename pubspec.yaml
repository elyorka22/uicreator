name: ai_ui_studio
description: AI UI Studio — generate reusable UI components with bring-your-own AI keys.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.4
  path_provider: ^2.1.5
  path: ^1.9.0
  shared_preferences: ^2.3.3
  uuid: ^4.5.1
  logger: ^2.5.0
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  collection: ^1.18.0
  drift: ^2.21.0
  sqlite3_flutter_libs: ^0.5.28
  sqlite3: ^2.4.6
  archive: ^3.6.1
  share_plus: ^10.1.2
  webview_flutter: ^4.10.0
  re_editor: ^0.6.0
  re_highlight: ^0.0.3
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  drift_dev: ^2.21.0

flutter:
  uses-material-design: true
  assets:
    - assets/schema/
    - assets/schema/examples/
